<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>{{APP_NAME}} · {{APP_TAGLINE}}</title>
    <meta name="description" content="{{APP_DESCRIPTION}}" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <!-- Non-blocking: a slow/offline network must never hold the first paint. -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Oswald:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=Suez+One&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <style>
      :where(html[data-theme='dark']), :where(html[data-theme='dark'] body) { background: #050505; }
    </style>
    <script>
      (function() {
        try {
          var store = localStorage.getItem('apparatus-preferences');
          if (store) {
            var state = JSON.parse(store).state;
            if (state && state.theme) {
              document.documentElement.dataset.theme = state.theme;
              return;
            }
          }
          // Default to light theme for new installs
          document.documentElement.dataset.theme = 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-ink text-bone antialiased">
    <div id="root">
      <div id="app-preloader" style="position:fixed;top:0;left:0;right:0;bottom:0;background-color:#f4a080;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;">
          <img src="/logo.png" alt="{{APP_NAME}}" style="width:112px;height:auto;margin-bottom:32px;opacity:0.9;animation:preloaderPulse 3s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.1));" />
        </div>
        <style>
          @keyframes preloaderPulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 0.5; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
