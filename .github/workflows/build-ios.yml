name: Build iOS IPA (Free)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'ios-native/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/**'

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "==> Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Patch Dependencies
        run: node ./ios-native/patch-ios.cjs

      - name: Build Web Application
        run: npm run build

      - name: Setup iOS Project
        run: |
          chmod +x ./ios-native/setup-ios.sh
          ./ios-native/setup-ios.sh

      - name: Compile App with Xcode (Unsigned)
        run: |
          cd ios/App
          echo "==> Ensuring patch-ios and pod install are up to date"
          node ../../ios-native/patch-ios.cjs
          pod install || true

          if [ -d "App.xcworkspace" ]; then
            echo "==> Found App.xcworkspace"
            XC_TARGET="-workspace App.xcworkspace"
          else
            echo "==> Using App.xcodeproj"
            XC_TARGET="-project App.xcodeproj"
          fi

          set -o pipefail
          BUILD_DIR="$(cd ../.. && pwd)/build"
          echo "==> Using absolute SYMROOT: $BUILD_DIR"
          xcodebuild clean build \
            $XC_TARGET \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            SYMROOT="$BUILD_DIR" 2>&1 | tee xcodebuild.log || {
              echo "==================== BUILD FAILED: COMPILER ERRORS ===================="
              grep -E "error:" xcodebuild.log || tail -n 60 xcodebuild.log
              exit 1
            }

      - name: Package .ipa
        run: |
          BUILD_DIR="$(pwd)/build"
          APP_PATH=$(find "$BUILD_DIR" ios /Users/runner/Library/Developer/Xcode/DerivedData -name "App.app" -type d 2>/dev/null | grep -E "Release-iphoneos/App\.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$BUILD_DIR" ios /Users/runner/Library/Developer/Xcode/DerivedData -name "App.app" -type d 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App.app bundle not found!"
            find . -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Apparatus.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apparatus-iOS-IPA
          path: Apparatus.ipa
          retention-days: 14
